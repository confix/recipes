# Checks every push and pull request; deploys main to Cloudflare.
#
# Deploying needs these repository (or `production` environment) secrets:
#   CLOUDFLARE_API_TOKEN   API token, permissions listed in README "Deploying"
#   CLOUDFLARE_ACCOUNT_ID  the account to deploy to
#   BETTER_AUTH_SECRET     session signing secret, e.g. `openssl rand -hex 32`
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # Never run two deploys (and their migrations) at once, and never cancel
    # one halfway.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check secrets
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BETTER_AUTH_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set. See README \"Deploying\"."
              missing=1
            fi
          done
          exit $missing

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Provision Cloudflare resources
        run: scripts/provision.sh

      # Before the build: afterwards wrangler reads the generated
      # build/server/wrangler.json instead of wrangler.jsonc.
      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply recipes-db --remote

      - run: pnpm build

      - name: Deploy
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          umask 077
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          node -e 'process.stdout.write(JSON.stringify({ BETTER_AUTH_SECRET: process.env.BETTER_AUTH_SECRET }))' > "$secrets_file"
          pnpm exec wrangler deploy --secrets-file "$secrets_file" --message "${GITHUB_SHA::7}"
